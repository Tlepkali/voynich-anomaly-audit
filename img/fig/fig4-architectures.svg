<svg xmlns="http://www.w3.org/2000/svg" width="560" height="292" viewBox="0 0 560 292"><title>Reaching the word-boundary information</title><rect width="560" height="292" fill="#ffffff"/><text x="0.0" y="18.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="600">Reaching the word-boundary information</text><text x="0.0" y="34.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5a5a5a" text-anchor="start" font-weight="normal">best three-character junction attained while the other three signatures are held</text><line x1="250.0" y1="52.0" x2="250.0" y2="212.0" stroke="#8a8a8a" stroke-width="1"/><text x="250.0" y="226.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal">0%</text><line x1="305.0" y1="52.0" x2="305.0" y2="212.0" stroke="#d0d0d0" stroke-width="1"/><text x="305.0" y="226.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal">25%</text><line x1="360.0" y1="52.0" x2="360.0" y2="212.0" stroke="#d0d0d0" stroke-width="1"/><text x="360.0" y="226.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal">50%</text><line x1="415.0" y1="52.0" x2="415.0" y2="212.0" stroke="#d0d0d0" stroke-width="1"/><text x="415.0" y="226.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal">75%</text><line x1="470.0" y1="52.0" x2="470.0" y2="212.0" stroke="#d0d0d0" stroke-width="1"/><text x="470.0" y="226.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal">100%</text><text x="238.0" y="68.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="normal">selection of whole words</text><text x="238.0" y="81.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="end" font-weight="normal">503 grid points</text><rect x="250.0" y="60.0" width="57.2" height="17.0" fill="#9a9a9a" opacity="1.0"/><text x="313.2" y="73.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal">26%</text><text x="238.0" y="110.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="normal">hybrid: memory ignores the boundary</text><text x="238.0" y="123.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="end" font-weight="normal">construction + memory</text><rect x="250.0" y="102.0" width="90.2" height="17.0" fill="#9a9a9a" opacity="1.0"/><text x="346.2" y="115.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal">41%</text><text x="238.0" y="152.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="normal">memory filtered for legality</text><text x="238.0" y="165.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="end" font-weight="normal">27 configurations</text><rect x="250.0" y="144.0" width="121.0" height="17.0" fill="#9a9a9a" opacity="1.0"/><text x="377.0" y="157.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal">55%</text><text x="238.0" y="194.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="600">memory weighted by transition frequency</text><text x="238.0" y="207.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="end" font-weight="normal">54 configurations</text><rect x="250.0" y="186.0" width="180.4" height="17.0" fill="#2b2b2b" opacity="1.0"/><text x="436.4" y="199.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="600">82%</text><text x="0.0" y="254.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal">Filtering preserves which boundary transitions are possible; weighting preserves their frequencies.</text><text x="0.0" y="268.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal">The junction lives in the distribution, not in its support — which is what the 55 → 82 step shows.</text></svg>