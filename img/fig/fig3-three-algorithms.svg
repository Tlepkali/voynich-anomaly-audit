<svg xmlns="http://www.w3.org/2000/svg" width="560" height="330" viewBox="0 0 560 330"><title>One quantity, three decompositions</title><rect width="560" height="330" fill="#ffffff"/><text x="0.0" y="18.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="600">One quantity, three decompositions</text><text x="0.0" y="34.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5a5a5a" text-anchor="start" font-weight="normal">shift in type-level slot rigidity after stripping affixes (manuscript, ZL3b, length 4)</text><line x1="251.8" y1="56.0" x2="251.8" y2="178.0" stroke="#d0d0d0" stroke-width="1"/><text x="251.8" y="192.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal">−15</text><line x1="321.6" y1="56.0" x2="321.6" y2="178.0" stroke="#d0d0d0" stroke-width="1"/><text x="321.6" y="192.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal">−10</text><line x1="391.3" y1="56.0" x2="391.3" y2="178.0" stroke="#d0d0d0" stroke-width="1"/><text x="391.3" y="192.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal">−5</text><line x1="461.1" y1="56.0" x2="461.1" y2="178.0" stroke="#8a8a8a" stroke-width="1"/><text x="461.1" y="192.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal">0</text><text x="198.0" y="74.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="normal">1  affix + vocabulary word</text><line x1="461.1" y1="70.0" x2="240.3" y2="70.0" stroke="#2b2b2b" stroke-width="2.2"/><circle cx="240.3" cy="70.0" r="4" fill="#2b2b2b"/><text x="250.3" y="60.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="600">−15.83</text><text x="198.0" y="118.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="normal">2  Goldsmith signatures</text><line x1="461.1" y1="114.0" x2="446.8" y2="114.0" stroke="#2b2b2b" stroke-width="2.2"/><circle cx="446.8" cy="114.0" r="4" fill="#2b2b2b"/><text x="436.8" y="118.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" text-anchor="end" font-weight="600">−1.02</text><text x="198.0" y="162.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="normal">3  Morfessor Baseline</text><rect x="304.0" y="151.0" width="15.1" height="14.0" fill="#c8c8c8" opacity="1.0"/><line x1="304.0" y1="151.0" x2="304.0" y2="165.0" stroke="#8a8a8a" stroke-width="1.2"/><line x1="319.1" y1="151.0" x2="319.1" y2="165.0" stroke="#8a8a8a" stroke-width="1.2"/><line x1="461.1" y1="158.0" x2="310.1" y2="158.0" stroke="#2b2b2b" stroke-width="2.2"/><circle cx="310.1" cy="158.0" r="4" fill="#2b2b2b"/><text x="300.1" y="162.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a" text-anchor="end" font-weight="600">−10.82</text><text x="198.0" y="214.0" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="end" font-weight="normal">spread over five seeds</text><rect x="210.0" y="204.0" width="24.0" height="12.0" fill="#c8c8c8" opacity="1.0"/><text x="0.0" y="242.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal">Morfessor has no seed of its own; its row is a mean of five runs, and Latin's own shift changes sign between them.</text><text x="0.0" y="256.0" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal">The spread between algorithms is the finding: no single number should be quoted without the procedure.</text></svg>